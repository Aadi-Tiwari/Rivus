<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipeTrace — district 2 incident board</title>
<script src="trace.js"></script>
<style>
  :root{
    --abyss:#03070D; --panel:#070F19; --panel2:#0A1624; --hair:#122334;
    --ink:#DAE8F4; --dim:#5A7A99; --dimmer:#3C566E;
    --water:#4FC9EA; --deep:#1B7A9B; --hot:#FF6A45; --ok:#35D9A0; --warn:#F2B33C;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --disp:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--abyss);color:var(--ink);font-family:var(--mono);
       font-size:13px;line-height:1.55;overflow:hidden;
       -webkit-font-smoothing:antialiased}

  #app{display:grid;grid-template-columns:330px 1fr 348px;
       grid-template-rows:52px 1fr 96px;height:100vh;gap:1px;background:var(--hair)}

  /* ---- header ---- */
  header{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;
         gap:20px;padding:0 20px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(79,201,234,.07),transparent 42%)}
  .brand{font-family:var(--disp);font-size:19px;letter-spacing:.005em;
         font-weight:600;position:relative}
  .brand i{font-style:italic;color:var(--water)}
  .tag{color:var(--dim);font-size:11px;letter-spacing:.13em;text-transform:uppercase}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px;
        letter-spacing:.08em}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--water);
       box-shadow:0 0 9px var(--water);animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---- rails ---- */
  aside{background:var(--panel);overflow-y:auto;padding:18px 18px 26px}
  aside::-webkit-scrollbar{width:5px}
  aside::-webkit-scrollbar-thumb{background:var(--hair);border-radius:3px}
  h2{font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);font-weight:700;
     text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:9px}
  h2::after{content:"";flex:1;height:1px;background:var(--hair)}
  .block{margin-bottom:20px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;font-size:12px}
  .kv b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
  .kv span{color:var(--dim)}
  .note{color:var(--dimmer);font-size:10.5px;line-height:1.55;margin-top:10px}

  .hero{font-family:var(--disp);font-size:46px;line-height:1;font-weight:600;
        font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .hero small{font-family:var(--mono);font-size:11px;color:var(--dim);
              letter-spacing:.04em;margin-left:9px;font-weight:400}
  .delta{color:var(--water);font-size:11px;letter-spacing:.05em;margin-top:5px}

  .rec{border:1px solid rgba(79,201,234,.4);border-radius:2px;padding:13px;
       background:linear-gradient(180deg,rgba(79,201,234,.09),rgba(79,201,234,.02));
       position:relative;overflow:hidden}
  .rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
               background:var(--water)}
  .rec .node{font-family:var(--disp);font-size:27px;font-weight:600;color:var(--water);
             line-height:1.05;margin-bottom:9px}
  .alt{display:flex;justify-content:space-between;color:var(--dimmer);font-size:11px;
       padding:3px 0;border-bottom:1px solid rgba(18,35,52,.7)}

  .pill{display:inline-block;padding:2.5px 8px;border-radius:2px;font-size:9.5px;
        letter-spacing:.13em;font-weight:700}
  .pill.no{background:rgba(255,106,69,.13);color:var(--hot);
           box-shadow:inset 0 0 0 1px rgba(255,106,69,.5)}
  .pill.yes{background:rgba(53,217,160,.12);color:var(--ok);
            box-shadow:inset 0 0 0 1px rgba(53,217,160,.5)}
  .pill.pick{background:var(--ok);color:#04120C;margin-left:6px}

  .plan{border:1px solid var(--hair);border-radius:2px;padding:9px 10px;margin-bottom:7px;
        transition:border-color .2s,background .2s}
  .plan.on{border-color:rgba(90,122,153,.6);background:rgba(10,22,36,.85)}
  .plan .nm{margin:7px 0 5px;font-size:12px}

  .pair{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;
        border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
  .pair em{font-style:normal;color:var(--hot)}

  /* ---- map ---- */
  main{background:
      radial-gradient(120% 90% at 50% -18%,rgba(27,122,155,.20),transparent 62%),
      radial-gradient(80% 70% at 82% 116%,rgba(27,122,155,.13),transparent 60%),
      var(--abyss);
      position:relative;overflow:hidden}
  main::before,main::after{content:"";position:absolute;inset:-25%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(79,201,234,.055),transparent);
    animation:drift 26s ease-in-out infinite alternate}
  main::before{width:70%;height:70%;left:4%;top:8%}
  main::after{width:60%;height:60%;left:46%;top:34%;animation-duration:34s;
              animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}
                   to{transform:translate3d(5%,7%,0) scale(1.16)}}
  main{display:flex;flex-direction:column}
  .mhead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
         padding:16px 22px 6px;position:relative;z-index:2}
  .mhead h1{font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:-.015em}
  .mhead h1 i{color:var(--water)}
  .mstat{color:var(--dimmer);font-size:10.5px;letter-spacing:.11em;white-space:nowrap}
  svg{width:100%;flex:1;min-height:0;display:block;position:relative}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
  .chip{font-size:10px;padding:2.5px 6px;border:1px solid var(--hair);border-radius:2px;
        color:var(--dim);font-variant-numeric:tabular-nums}
  .chip.lead{border-color:var(--hot);color:var(--hot)}
  .bar{height:3px;background:var(--hair);border-radius:2px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--water);transition:width .4s}
  .score{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;
         border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
  .score.win b{color:var(--ok)}
  .score.lose b{color:var(--dim)}

  .flow{animation:flow 2.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-100}}
  .ripple{animation:ripple 1.5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ripple{from{opacity:.9}to{opacity:0}}

  /* ---- timeline ---- */
  footer{grid-column:1/-1;background:var(--panel);display:flex;align-items:stretch;
         gap:1px;padding:0}
  .nav{display:flex;align-items:center;padding:0 16px;background:var(--panel)}
  button{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;padding:9px 15px;
         background:transparent;color:var(--dim);border:1px solid var(--hair);
         border-radius:2px;cursor:pointer;transition:.16s}
  button:hover:not(:disabled){border-color:var(--water);color:var(--water)}
  button:disabled{opacity:.25;cursor:default}
  button.go{border-color:rgba(79,201,234,.55);color:var(--water);
            background:rgba(79,201,234,.09)}
  .steps{display:flex;gap:1px;flex:1;background:var(--hair)}
  .st{flex:1;background:var(--panel);padding:11px 12px;cursor:pointer;
      border-top:2px solid transparent;transition:.18s;position:relative;min-width:0}
  .st:hover{background:var(--panel2)}
  .st.on{border-top-color:var(--water);background:var(--panel2)}
  .st.on::after{content:"";position:absolute;inset:0 0 auto;height:34px;
    background:linear-gradient(180deg,rgba(79,201,234,.10),transparent)}
  .st .n{font-size:9px;color:var(--dimmer);letter-spacing:.16em;font-weight:700}
  .st .v{font-family:var(--disp);font-size:21px;font-weight:600;line-height:1.15;
         font-variant-numeric:tabular-nums}
  .st .s{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis}
  .st.on .v{color:var(--water)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Pipe<i>Trace</i></div>
    <div class="tag" id="hdr"></div>
    <div class="spacer"></div>
    <div class="live"><span class="dot"></span><span id="hdr2"></span></div>
  </header>

  <aside id="left"></aside>
  <main>
    <div class="mhead">
      <h1>What we know, and what we <i>don't</i></h1>
      <div class="mstat" id="mstat"></div>
    </div>
    <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
  </main>
  <aside id="right"></aside>

  <footer>
    <div class="nav"><button id="prev">◀</button></div>
    <div class="steps" id="steps"></div>
    <div class="nav"><button id="next" class="go">NEXT ▶</button></div>
  </footer>
</div>

<script>
const T = window.TRACE, S = T.scenario;
const $ = id => document.getElementById(id);
const f = (v,n=2) => Number(v).toFixed(n);

const NP = T.steps.length, NPLAN = T.isolation.length;
const LAST = NP + 1 + NPLAN;
// Land on the state where the answer exists. Opening at rest shows uniform bars and a
// system that has done nothing, which is the worst possible first three seconds.
let stage = NP + 1 + Math.max(0, T.isolation.findIndex(p => p.chosen));

const byName = {};
T.nodes.forEach(n => byName[n.name] = n);
const xs = T.nodes.map(n=>n.x), ys = T.nodes.map(n=>n.y), pad = 7;
const bb = {x0:Math.min(...xs)-pad, y0:Math.min(...ys)-pad,
            w:Math.max(...xs)-Math.min(...xs)+pad*2,
            h:Math.max(...ys)-Math.min(...ys)+pad*2};
$('map').setAttribute('viewBox', `${bb.x0} ${bb.y0} ${bb.w} ${bb.h}`);
const SC = bb.w/100;

function credibleSet(post, mass=0.90){
  const rows = Object.entries(post).sort((a,b)=>b[1]-a[1]);
  const out=[]; let acc=0;
  for(const [n,p] of rows){ out.push(n); acc+=p; if(acc>=mass) break; }
  return out;
}
const posteriorAt = s => s<1
  ? Object.fromEntries(T.nodes.map(n=>[n.name,1/T.nodes.length]))
  : T.steps[Math.min(s,NP)-1].posterior;
const planAt = s => (s>=NP+2 && s<=NP+1+NPLAN) ? T.isolation[s-NP-2] : null;
const strandedAt = s => planAt(s) ? planAt(s).stranded_graph : [];
const cutAt = s => planAt(s) ? planAt(s).segment : [];

function draw(){
  const post = posteriorAt(stage);
  const stranded = strandedAt(stage), cut = cutAt(stage);
  const probed = T.steps.slice(0, Math.min(stage,NP)).map(s=>s.chosen);
  const fused = stage===NP+1
    ? [...new Set(T.identifiability.blocked.slice(0,14).flatMap(b=>[b[1],b[2]]))] : [];

  let g = `<defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="${SC*.85}" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  // belief, drawn beneath the network. Scaled against the uniform prior — sizing by
  // the running max would paint the whole district red when nothing is known yet.
  T.nodes.forEach(n=>{
    const rel = (post[n.name]||0) * T.nodes.length;
    if(rel>0.4){
      const k = Math.min(rel,8);
      g += `<circle cx="${n.x}" cy="${n.y}" r="${SC*(1+k*1.08)}" fill="var(--hot)"
            fill-opacity="${Math.min(.05+k*.05,.42)}"/>`;
    }
  });

  // Pipes render in two layers: a static tube, and a current that animates along it.
  // The current is the honest bit — it stops wherever the network has lost supply, so
  // a stranded district visibly goes still rather than just changing colour.
  T.pipes.forEach(p=>{
    const a=byName[p.a], b=byName[p.b];
    if(!a||!b) return;
    const isCut = cut.includes(p.pid);
    const dead = stranded.includes(p.a) && stranded.includes(p.b);
    const tube = isCut ? 'rgba(255,106,69,.30)' : dead ? '#0C1622' : 'rgba(27,122,155,.42)';
    g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
          stroke="${tube}" stroke-width="${SC*.85}" stroke-linecap="round"/>`;
    if(!isCut && !dead){
      const len = Math.hypot(b.x-a.x, b.y-a.y);
      g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="flow"
            stroke="var(--water)" stroke-opacity=".62" stroke-width="${SC*.34}"
            stroke-linecap="round" stroke-dasharray="${SC*1.1} ${SC*3.2}"
            pathLength="100" style="animation-duration:${(1.6+len/26).toFixed(2)}s"/>`;
    }
    if(isCut){
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;
      g += `<g transform="translate(${mx} ${my}) rotate(${ang})" filter="url(#glow)">
        <line x1="0" y1="${-SC*1.5}" x2="0" y2="${SC*1.5}" stroke="var(--hot)"
              stroke-width="${SC*.5}" stroke-linecap="round"/></g>`;
    }
  });

  // junctions
  T.nodes.forEach(n=>{
    const out = stranded.includes(n.name), isFused = fused.includes(n.name);
    const isProbe = probed.includes(n.name);
    let fill = out ? '#1B2938' : '#8FAAC6';
    if(n.critical) fill = out ? 'var(--hot)' : 'var(--ok)';
    if(isProbe) fill = 'var(--water)';
    if(isFused) fill = 'var(--warn)';
    const r = n.critical ? SC*1.35 : SC*.8;
    const fx = (isProbe||n.critical||isFused) ? ' filter="url(#glow)"' : '';
    g += `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}"${fx}/>`;

    if(n.critical){
      const c = out?'var(--hot)':'var(--ok)';
      g += `<circle cx="${n.x}" cy="${n.y}" r="${SC*2.6}" fill="none" stroke="${c}"
            stroke-opacity=".75" stroke-width="${SC*.28}"/>
        <text x="${n.x+SC*3.6}" y="${n.y+SC*.9}" font-size="${SC*2.2}" fill="${c}"
        letter-spacing="${SC*.14}" font-family="var(--mono)">HOSPITAL</text>`;
    }
    if(isProbe) g += `<text x="${n.x}" y="${n.y-SC*2}" font-size="${SC*2.1}"
        fill="var(--water)" text-anchor="middle" font-family="var(--mono)">${n.name}</text>`;
    if(isFused) g += `<text x="${n.x}" y="${n.y-SC*1.9}" font-size="${SC*2}"
        fill="var(--warn)" text-anchor="middle" font-family="var(--mono)">${n.name}</text>`;
  });

  // pressure wave from the measurement just taken
  if(stage>=1 && stage<=NP){
    const c = byName[T.steps[stage-1].chosen];
    if(c) for(let i=0;i<3;i++)
      g += `<circle cx="${c.x}" cy="${c.y}" r="${SC*(3+i*3.2)}" fill="none"
            stroke="var(--water)" stroke-width="${SC*.3}" class="ripple"
            style="animation-delay:${i*.22}s"/>`;
  }

  // truth, revealed only once probing is done
  if(stage>=NP+1){
    const t = byName[S.truth];
    if(t) g += `<circle cx="${t.x}" cy="${t.y}" r="${SC*2.1}" fill="none" stroke="#fff"
        stroke-opacity=".8" stroke-width="${SC*.3}" stroke-dasharray="${SC*.75} ${SC*.65}"/>
      <text x="${t.x}" y="${t.y+SC*4.9}" font-size="${SC*2}" fill="#fff" opacity=".7"
        text-anchor="middle" font-family="var(--mono)">ACTUAL ${S.truth}</text>`;
  }
  $('map').innerHTML = g;
  panels(); chips();
}

function panels(){
  const st = (stage>=1 && stage<=NP) ? T.steps[stage-1] : null;
  const held = stage>=1 ? T.steps[Math.min(stage,NP)-1] : null;
  const prev = stage>=2 ? T.steps[Math.min(stage,NP)-2] : null;

  let L = `<div class="block"><h2>Incident</h2>
    <div class="kv"><span>district draw</span><b>${f(S.demand_lps,1)} L/s</b></div>
    <div class="kv"><span>candidate junctions</span><b>${T.nodes.length}</b></div>
    <div class="kv"><span>hydraulic runs</span><b>${S.sims} in ${f(S.sim_seconds)}s</b></div>
    <div class="kv"><span>gauge sigma</span><b>${f(S.sigma)} psi</b></div>
    <div class="note">Readings come from a perturbed model — demands and pipe roughness
    shifted — so the diagnosis is not inverting its own simulator.</div></div>`;

  if(st){
    L += `<div class="block"><h2>Next best test</h2>
      <div class="rec"><div class="node">Node ${st.chosen}</div>
        <div class="kv"><span>expected gain</span><b>${f(st.bits)} bits</b></div>
        <div class="kv"><span>crew travel</span><b>${f(st.minutes,0)} min</b></div>
        <div class="kv"><span>measured</span><b>${st.reading>=0?'+':''}${f(st.reading)} psi</b></div>
      </div><div style="margin-top:11px">`;
    st.candidates.slice(1,5).forEach(c=>{
      L += `<div class="alt"><span>node ${c.node}</span><span>${f(c.bits)} bits · ${f(c.minutes,0)}m</span></div>`;
    });
    L += `</div><div class="note">Every candidate is scored by expected information
      gain over the belief held on the graph — not just the convenient ones.</div></div>`;
  } else if(stage===0){
    L += `<div class="block"><h2>Status</h2><div class="note">A main has failed somewhere
      in this district. Every junction is a live hypothesis. One crew check costs about
      an hour; the wrong excavation costs about twenty thousand dollars.</div></div>`;
  }

  // Only shown once a reading exists. At rest every candidate is equally likely and this
  // panel would be a row of identical bars pretending to be a result.
  if(held){
    const prior = Math.log2(T.nodes.length);
    const surv = credibleSet(posteriorAt(stage));
    L += `<div class="block"><h2>Uncertainty</h2>
      <div class="hero">${f(held.entropy)}<small>bits · was ${f(prior)} before any probe</small></div>
      <div class="bar"><i style="width:${(held.entropy/prior*100).toFixed(1)}%"></i></div>
      ${prev ? `<div class="delta">▼ ${f(prev.entropy-held.entropy)} bits from the last reading</div>`:''}
      <div class="kv" style="margin-top:12px"><span>crew dispatches</span><b>${Math.min(stage,NP)} of ${NP}</b></div>
      </div>
      <div class="block"><h2>Still in play · 90% credible set</h2>
      <div class="chips">${surv.map((n,i)=>`<span class="chip ${i===0?'lead':''}">${n}</span>`).join('')}</div>
      <div class="note">${surv.length} of ${T.nodes.length} junctions. Top-1 is not a call
      we make — on this network 179 of 210 surviving pairs are hydraulically
      indistinguishable.</div></div>`;
  }
  $('left').innerHTML = L;

  const I = T.identifiability;
  let R = '';
  if(T.measured && T.measured.length){
    R += `<div class="block"><h2>Measured against a random control</h2>`;
    T.measured.forEach(m=>{
      const win = m.lift > 20;
      R += `<div style="margin-bottom:13px">
        <div class="kv"><span>${m.net.split('  ')[0]} · ${m.junctions} junctions</span>
          <b style="color:${win?'var(--ok)':'var(--dim)'}">${m.lift>0?'+':''}${f(m.lift,0)}% closer</b></div>
        <div class="score ${win?'win':'lose'}"><span>top-1 information gain</span><b>${f(m.info_top1,1)}%</b></div>
        <div class="score"><span>top-1 random control</span><b>${f(m.rand_top1,1)}%</b></div>
      </div>`;
    });
    R += `<div class="note">Our first headline number was 43% closer. A teammate's
      non-circularity gate proved that setup was marking its own homework, so it was
      withdrawn. This is what survived: no measurable advantage on the small network,
      and 3.6x better than chance on a real district at p&lt;0.01.</div></div>`;
  }

  if(stage>=NP+1){
    R += `<div class="block"><h2>What pressure cannot resolve</h2>
      <div class="kv"><span>verdict</span><b>${I.verdict.replace(/_/g,' ').toLowerCase()}</b></div>
      <div class="kv"><span>unresolvable pairs</span><b>${I.blocked.length} of ${I.n_pairs}</b></div>
      <div style="margin-top:11px">`;
    I.blocked.slice(0,6).forEach(b=>{
      R += `<div class="pair"><span><em>${b[1]}</em> vs <em>${b[2]}</em></span>
            <span>${f(b[0],3)} psi</span></div>`;
    });
    R += `</div><div class="note">These differ by less than the ${f(I.threshold)} psi we
      can distinguish, anywhere in the network. No probe sequence separates them — the
      information is not there. Best remaining sensor site is node ${I.advice_node}
      at ${f(I.advice_sep,2)} psi.</div></div>`;
  }
  if(stage>=NP+1 && T.candidates){
    R += `<div class="block"><h2>Plans per candidate</h2>
      <div class="note" style="margin:0 0 11px">The exact junction is identified about
      10% of the time, so every candidate the evidence still supports gets its own
      isolation plan.</div>`;
    T.candidates.forEach(c=>{
      const bad = c.naive_critical_psi < S.critical_min_psi;
      R += `<div class="plan">
        <span class="pill ${c.safe?'yes':'no'}">${c.safe?'SAFE PLAN':'NO SAFE PLAN'}</span>
        <div class="nm">node ${c.candidate} · p=${f(c.probability,3)}</div>
        <div class="kv"><span>${c.valves} valves · hospital holds</span><b>${f(c.critical_psi)} psi</b></div>
        <div class="kv"><span>wrong valve set</span>
          <b style="color:${bad?'var(--hot)':'var(--ink)'}">${f(c.naive_critical_psi)} psi</b></div>
      </div>`;
    });
    if(T.dangerous && T.dangerous.length)
      R += `<div class="note" style="color:var(--hot)">At ${T.dangerous.join(' and ')}
        there is a valve configuration that puts the hospital below
        ${f(S.critical_min_psi,0)} psi.</div>`;
    R += `</div>`;
  }
  if(stage>=NP+2){
    R += `<div class="block"><h2>Valve search · ${NPLAN} configurations</h2>`;
    T.isolation.forEach((p,i)=>{
      R += `<div class="plan ${i===stage-NP-2?'on':''}">
        <span class="pill ${p.accepted?'yes':'no'}">${p.accepted?'ACCEPTED':'REJECTED'}</span>
        ${p.chosen?'<span class="pill pick">CHOSEN</span>':''}
        <div class="nm">${p.name}</div>
        <div class="kv"><span>valves turned</span><b>${p.valves}</b></div>
        <div class="kv"><span>hospital</span><b>${f(p.baseline_psi)} → ${f(p.critical_psi)} psi</b></div>
        <div class="kv"><span>customers out</span><b>${p.stranded_hydraulics} of ${T.nodes.length}</b></div>
        <div class="kv"><span>graph walker</span><b>${p.stranded_graph.length} stranded</b></div>
        <div class="kv"><span>cross-check</span>
          <b style="color:${p.agree?'var(--ok)':'var(--hot)'}">${p.agree?'AGREE':'DISAGREE'}</b></div>
      </div>`;
    });
    R += `<div class="note">A walker grows valve rings outward from the break, and every
      configuration is screened twice by methods sharing no code: graph reachability
      through open pipe edges, and a pressure-dependent hydraulic run on the same valves.
      Modeled service impact — not a safety certification.</div></div>`;
  }
  if(!R) R = `<div class="block"><h2>Evidence</h2><div class="note">Probe results, what
    the physics cannot resolve, and the isolation cross-check appear here as the
    investigation proceeds.</div></div>`;
  $('right').innerHTML = R;

  $('hdr').textContent = `district 2 · live diagnosis`;
  $('mstat').textContent = `${T.nodes.length} junctions · ${T.pipes.length} pipes · `
    + `${S.sims} hydraulic runs in ${f(S.sim_seconds)}s`;
  $('hdr2').textContent = stage>=NP+1
    ? `break at node ${S.truth} · ${f(S.leak_lps,1)} L/s · ${f(S.leak_pct,0)}% of draw`
    : `leak hidden · ${S.sims} hydraulic runs complete`;
}

function chips(){
  const names = ['AT REST', ...T.steps.map(s=>`PROBE ${s.step}`), 'LIMITS',
                 ...T.isolation.map((p,i)=>`PLAN ${String.fromCharCode(65+i)}`)];
  let h='';
  for(let i=0;i<=LAST;i++){
    let v='—', s='';
    if(i===0){ v=T.nodes.length; s='candidates'; }
    else if(i<=NP){ v=T.steps[i-1].survivors; s=`node ${T.steps[i-1].chosen}`; }
    else if(i===NP+1){ v=T.identifiability.blocked.length; s='fused pairs'; }
    else { const p=T.isolation[i-NP-2]; v=f(p.critical_psi,1);
           s=(p.accepted?'psi · accepted':'psi · rejected')+(p.chosen?' ★':''); }
    h += `<div class="st ${i===stage?'on':''}" data-i="${i}">
            <div class="n">${names[i]}</div><div class="v">${v}</div>
            <div class="s">${s}</div></div>`;
  }
  $('steps').innerHTML = h;
  document.querySelectorAll('.st').forEach(e=>
    e.onclick = ()=>{ stage=+e.dataset.i; draw(); });
  $('prev').disabled = stage===0;
  $('next').disabled = stage===LAST;
}

$('next').onclick = ()=>{ if(stage<LAST){stage++;draw();} };
$('prev').onclick = ()=>{ if(stage>0){stage--;draw();} };
document.onkeydown = e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); $('next').click(); }
  if(e.key==='ArrowLeft') $('prev').click();
};
draw();
</script>
</body>
</html>
