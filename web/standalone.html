<style>
  :root{
    --ground:#070C14; --panel:#0C1524; --line:#16233A; --ink:#DCE7F2;
    --dim:#5E7492; --water:#3FB8D4; --hot:#FF6B4A; --ok:#4ADE9B; --warn:#F0B429;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--mono);
       font-size:13px;line-height:1.5;overflow:hidden}
  #app{display:grid;grid-template-columns:300px 1fr 300px;grid-template-rows:44px 1fr 104px;
       height:100vh;gap:1px;background:var(--line)}
  header{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;
         gap:18px;padding:0 16px}
  .brand{font-weight:700;letter-spacing:.16em;font-size:12px}
  .brand b{color:var(--water)}
  .meta{color:var(--dim);font-size:11px;letter-spacing:.05em}
  .spacer{flex:1}
  aside{background:var(--panel);overflow-y:auto;padding:14px}
  main{background:var(--ground);position:relative;overflow:hidden}
  footer{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;
         gap:10px;padding:0 16px}
  h2{font-size:10px;letter-spacing:.18em;color:var(--dim);font-weight:600;
     margin-bottom:9px;text-transform:uppercase}
  .block{margin-bottom:20px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px}
  .kv span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
  .kv span:first-child{color:var(--dim)}
  .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .unit{font-size:11px;color:var(--dim);margin-left:4px}
  .rec{border:1px solid var(--water);border-radius:3px;padding:11px;margin-bottom:9px;
       background:rgba(63,184,212,.06)}
  .rec .node{font-size:20px;font-weight:700;color:var(--water)}
  .alt{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;padding:2px 0}
  .pill{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;
        letter-spacing:.1em;font-weight:700}
  .pill.no{background:rgba(255,107,74,.15);color:var(--hot);border:1px solid var(--hot)}
  .pill.yes{background:rgba(74,222,155,.13);color:var(--ok);border:1px solid var(--ok)}
  .plan{border:1px solid var(--line);border-radius:3px;padding:10px;margin-bottom:8px}
  .plan.sel{border-color:var(--dim)}
  .pair{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;
        border-bottom:1px solid var(--line)}
  .pair b{color:var(--hot);font-weight:600}
  button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:7px 15px;
         background:transparent;color:var(--ink);border:1px solid var(--line);
         border-radius:2px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--water);color:var(--water)}
  button:disabled{opacity:.3;cursor:default}
  button.primary{border-color:var(--water);color:var(--water);
                 background:rgba(63,184,212,.08)}
  .steps{display:flex;gap:1px;flex:1}
  .st{flex:1;background:var(--ground);border-top:2px solid var(--line);padding:7px 10px;
      cursor:pointer;transition:border-color .15s}
  .st.on{border-top-color:var(--water);background:rgba(63,184,212,.05)}
  .st .n{font-size:10px;color:var(--dim);letter-spacing:.1em}
  .st .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .st .s{font-size:10px;color:var(--dim)}
  svg{width:100%;height:100%;display:block}
  text{font-family:var(--mono)}
  .note{color:var(--dim);font-size:10.5px;line-height:1.45;margin-top:7px}
  .rule{height:1px;background:var(--line);margin:13px 0}
  @keyframes ping{0%{r:5;opacity:.85}100%{r:26;opacity:0}}
  .ping{animation:ping 1.1s ease-out forwards}
</style>

<body>
<div id="app">
  <header>
    <div class="brand"><b>PIPE</b>TRACE</div>
    <div class="meta" id="hdr">district 2 · incident board</div>
    <div class="spacer"></div>
    <div class="meta" id="hdr2"></div>
  </header>

  <aside id="left"></aside>
  <main><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></main>
  <aside id="right"></aside>

  <footer>
    <button id="prev">◀ BACK</button>
    <div class="steps" id="steps"></div>
    <button id="next" class="primary">NEXT ▶</button>
  </footer>
</div>

<script>
const T = window.TRACE;
const S = T.scenario;
const $ = id => document.getElementById(id);
const f = (v,n=2) => Number(v).toFixed(n);

// stage 0 = network at rest, 1..N = after each probe,
// N+1 = identifiability, N+2/N+3 = isolation plans
const NP = T.steps.length;
const NPLAN = T.isolation.length;
const LAST = NP + 1 + NPLAN;      // rest + probes + limits + one stage per valve plan
let stage = 0;

const byName = {};
T.nodes.forEach(n => byName[n.name] = n);
const xs = T.nodes.map(n=>n.x), ys = T.nodes.map(n=>n.y);
const pad = 6;
const bb = {x0:Math.min(...xs)-pad, x1:Math.max(...xs)+pad,
            y0:Math.min(...ys)-pad, y1:Math.max(...ys)+pad};
$('map').setAttribute('viewBox', `${bb.x0} ${bb.y0} ${bb.x1-bb.x0} ${bb.y1-bb.y0}`);
const SC = (bb.x1-bb.x0)/100;              // stroke/– scale so lines read at any zoom

function posteriorAt(s){
  if (s<1) { const u={}; T.nodes.forEach(n=>u[n.name]=1/T.nodes.length); return u; }
  return T.steps[Math.min(s,NP)-1].posterior;
}
const planAt = s => (s>=NP+2 && s<=NP+1+NPLAN) ? T.isolation[s-NP-2] : null;
const strandedAt = s => planAt(s) ? planAt(s).stranded_graph : [];
const cutAt = s => planAt(s) ? planAt(s).segment : [];

function draw(){
  const post = posteriorAt(stage);
  const stranded = strandedAt(stage);
  const cut = cutAt(stage);
  const probed = T.steps.slice(0, Math.min(stage,NP)).map(s=>s.chosen);
  const fused = stage===NP+1
      ? [...new Set(T.identifiability.blocked.slice(0,14).flatMap(b=>[b[1],b[2]]))] : [];

  let g = '';
  // hypothesis bloom, drawn under the network.
  // Scaled against the uniform prior, not against the running max: at rest every
  // candidate is equally likely, and sizing by max would paint the whole district red.
  T.nodes.forEach(n=>{
    const rel = (post[n.name]||0) * T.nodes.length;   // 1.0 == uniform
    if(rel>0.35){
      const k = Math.min(rel, 8);
      g += `<circle cx="${n.x}" cy="${n.y}" r="${SC*(0.9+k*1.05)}"
            fill="var(--hot)" fill-opacity="${Math.min(0.07+k*0.055,0.5)}"/>`;
    }
  });
  // pipes
  T.pipes.forEach(p=>{
    const a=byName[p.a], b=byName[p.b];
    if(!a||!b) return;
    const isCut = cut.includes(p.pid);
    const dead = stranded.includes(p.a) && stranded.includes(p.b);
    const col = isCut ? 'var(--hot)' : dead ? '#1A2434' : 'var(--water)';
    const op  = isCut ? 1 : dead ? .5 : .34;
    g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}"
          stroke-opacity="${op}" stroke-width="${SC*.55}"
          ${isCut?`stroke-dasharray="${SC*1.4} ${SC*1.1}"`:''}/>`;
    if(isCut){
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      g += `<circle cx="${mx}" cy="${my}" r="${SC*1.5}" fill="none"
            stroke="var(--hot)" stroke-width="${SC*.5}"/>`;
    }
  });
  // junctions
  T.nodes.forEach(n=>{
    const out = stranded.includes(n.name);
    const isFused = fused.includes(n.name);
    let fill = out ? '#22303F' : '#9FB6CE';
    if(n.critical) fill = out ? 'var(--hot)' : 'var(--ok)';
    if(probed.includes(n.name)) fill = 'var(--water)';
    if(isFused) fill = 'var(--warn)';
    const r = n.critical ? SC*1.5 : SC*.95;
    g += `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}"/>`;
    if(n.critical) g += `<circle cx="${n.x}" cy="${n.y}" r="${SC*2.7}" fill="none"
        stroke="${out?'var(--hot)':'var(--ok)'}" stroke-width="${SC*.36}"/>
        <text x="${n.x+SC*3.4}" y="${n.y+SC*1}" font-size="${SC*2.5}"
        fill="${out?'var(--hot)':'var(--ok)'}" letter-spacing="${SC*.1}">HOSPITAL</text>`;
    if(probed.includes(n.name))
      g += `<text x="${n.x}" y="${n.y-SC*2.2}" font-size="${SC*2.3}" fill="var(--water)"
            text-anchor="middle">${n.name}</text>`;
    if(isFused)
      g += `<text x="${n.x}" y="${n.y-SC*2}" font-size="${SC*2.1}" fill="var(--warn)"
            text-anchor="middle">${n.name}</text>`;
  });
  // live recommendation marker
  if(stage>=1 && stage<=NP){
    const c = byName[T.steps[stage-1].chosen];
    if(c) g += `<circle cx="${c.x}" cy="${c.y}" r="5" fill="none" stroke="var(--water)"
                stroke-width="${SC*.45}" class="ping"/>`;
  }
  // truth, revealed only at the end
  if(stage>=NP+1){
    const t = byName[S.truth];
    if(t) g += `<circle cx="${t.x}" cy="${t.y}" r="${SC*2.2}" fill="none"
        stroke="#fff" stroke-width="${SC*.36}" stroke-dasharray="${SC*.8} ${SC*.7}"/>
        <text x="${t.x}" y="${t.y+SC*5.2}" font-size="${SC*2.3}" fill="#fff"
        text-anchor="middle" opacity=".75">ACTUAL ${S.truth}</text>`;
  }
  $('map').innerHTML = g;
  panels();
  chips();
}

function panels(){
  const st = (stage>=1 && stage<=NP) ? T.steps[stage-1] : null;
  const prev = stage>=2 ? T.steps[Math.min(stage,NP)-2] : null;

  let L = `<div class="block"><h2>Incident</h2>
    <div class="kv"><span>district draw</span><span>${f(S.demand_lps,1)} L/s</span></div>
    <div class="kv"><span>candidate junctions</span><span>${T.nodes.length}</span></div>
    <div class="kv"><span>hydraulic runs</span><span>${S.sims} in ${f(S.sim_seconds)}s</span></div>
    <div class="kv"><span>gauge sigma</span><span>${f(S.sigma)} psi</span></div>
    <div class="note">Readings are generated from a perturbed model — demands and pipe
    roughness shifted — so the diagnosis is not inverting its own simulator.</div></div>`;

  if(st){
    L += `<div class="block"><h2>Next best test</h2>
      <div class="rec"><div class="node">NODE ${st.chosen}</div>
        <div class="kv"><span>expected gain</span><span>${f(st.bits)} bits</span></div>
        <div class="kv"><span>crew travel</span><span>${f(st.minutes,0)} min</span></div>
        <div class="kv"><span>measured</span><span>${st.reading>=0?'+':''}${f(st.reading)} psi</span></div>
      </div>`;
    st.candidates.slice(1,5).forEach(c=>{
      L += `<div class="alt"><span>node ${c.node}</span><span>${f(c.bits)} bits · ${f(c.minutes,0)}m</span></div>`;
    });
    L += `<div class="note">Ranked by expected information gain over the belief on the
      graph. Every candidate is scored, not just the nearby ones.</div></div>`;
  } else if(stage===0){
    L += `<div class="block"><h2>Status</h2>
      <div class="note">Somewhere in this district a main has failed. Every junction is a
      live hypothesis. A crew check costs about an hour; the wrong excavation costs about
      twenty thousand dollars.</div></div>`;
  }

  // belief persists past the probing stages: the isolation screens act on the final
  // posterior, so resetting the count there would misreport what was actually known.
  const held = stage>=1 ? T.steps[Math.min(stage,NP)-1] : null;
  L += `<div class="block"><h2>Belief</h2>
    <div class="big">${held ? held.survivors : T.nodes.length}<span class="unit">of ${T.nodes.length} in the 90% set</span></div>
    ${held ? `<div class="kv"><span>entropy</span><span>${f(held.entropy)} bits</span></div>
    <div class="kv"><span>leading</span><span>node ${held.top} (p=${f(held.top_prob)})</span></div>`:''}
    ${prev ? `<div class="kv"><span>previous</span><span>${prev.survivors} candidates</span></div>`:''}
    </div>`;
  $('left').innerHTML = L;

  const I = T.identifiability;
  let R = '';
  if(stage>=NP+1){
    R += `<div class="block"><h2>What pressure cannot resolve</h2>
      <div class="kv"><span>verdict</span><span>${I.verdict.replace(/_/g,' ').toLowerCase()}</span></div>
      <div class="kv"><span>unresolvable pairs</span><span>${I.blocked.length} of ${I.n_pairs}</span></div>
      <div class="rule"></div>`;
    I.blocked.slice(0,6).forEach(b=>{
      R += `<div class="pair"><span><b>${b[1]}</b> vs <b>${b[2]}</b></span>
            <span>${f(b[0],3)} psi</span></div>`;
    });
    R += `<div class="note">These differ by less than the ${f(I.threshold)} psi we can
      distinguish, anywhere in the network. No probe sequence separates them — the
      information is not there. Best remaining sensor site is node ${I.advice_node}
      at ${f(I.advice_sep,2)} psi.</div></div>`;
  }
  if(stage>=NP+2){
    const cur = planAt(stage);
    R += `<div class="block"><h2>Valve search · ${T.isolation.length} configurations</h2>`;
    T.isolation.forEach((p,i)=>{
      const on = (i === stage-NP-2);
      R += `<div class="plan ${on?'sel':''}">
        <span class="pill ${p.accepted?'yes':'no'}">${p.accepted?'ACCEPTED':'REJECTED'}</span>
        <div style="margin-top:7px">${p.name}${p.chosen?' <span class="pill yes">CHOSEN</span>':''}</div>
        <div class="kv"><span>valves turned</span><span>${p.valves}</span></div>
        <div class="kv"><span>hospital</span><span>${f(p.baseline_psi)} → ${f(p.critical_psi)} psi</span></div>
        <div class="kv"><span>customers out</span><span>${p.stranded_hydraulics} of ${T.nodes.length}</span></div>
        <div class="kv"><span>graph walker</span><span>${p.stranded_graph.length} stranded</span></div>
        <div class="kv"><span>cross-check</span><span style="color:${p.agree?'var(--ok)':'var(--hot)'}">
          ${p.agree?'AGREE':'DISAGREE'}</span></div></div>`;
    });
    R += `<div class="note">A walker grows valve rings outward from the break and every
      configuration is screened twice, independently: graph reachability through open
      pipe edges, and a pressure-dependent hydraulic run on the same valves. Ranked by
      holding the hospital, then fewest customers stranded, then fewest valves turned.
      Modeled service impact, not a safety certification.</div></div>`;
  }
  if(!R) R = `<div class="block"><h2>Evidence</h2><div class="note">Probe results, what the
    physics cannot resolve, and the isolation cross-check appear here as the
    investigation proceeds.</div></div>`;
  $('right').innerHTML = R;

  $('hdr').textContent = `district 2 · ${T.nodes.length} junctions · ${T.pipes.length} pipes`;
  $('hdr2').textContent = stage>=NP+1
    ? `actual break at node ${S.truth} · ${f(S.leak_lps,1)} L/s (${f(S.leak_pct,0)}% of draw)`
    : `leak location hidden · ${S.sims} hydraulic runs completed`;
}

function chips(){
  const names = ['AT REST', ...T.steps.map(s=>`PROBE ${s.step}`), 'LIMITS',
                 ...T.isolation.map((p,i)=>`PLAN ${String.fromCharCode(65+i)}`)];
  let h='';
  for(let i=0;i<=LAST;i++){
    let v='—', s='';
    if(i===0){ v=T.nodes.length; s='candidates'; }
    else if(i<=NP){ v=T.steps[i-1].survivors; s=`node ${T.steps[i-1].chosen}`; }
    else if(i===NP+1){ v=T.identifiability.blocked.length; s='fused pairs'; }
    else { const p=T.isolation[i-NP-2]; v=f(p.critical_psi,1);
           s=(p.accepted?'psi · accepted':'psi · rejected')+(p.chosen?' ★':''); }
    h += `<div class="st ${i===stage?'on':''}" data-i="${i}">
            <div class="n">${names[i]}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  }
  $('steps').innerHTML = h;
  document.querySelectorAll('.st').forEach(e=>
    e.onclick = ()=>{ stage=+e.dataset.i; draw(); });
  $('prev').disabled = stage===0;
  $('next').disabled = stage===LAST;
}

$('next').onclick = ()=>{ if(stage<LAST){stage++;draw();} };
$('prev').onclick = ()=>{ if(stage>0){stage--;draw();} };
document.onkeydown = e=>{
  if(e.key==='ArrowRight'||e.key===' ') $('next').click();
  if(e.key==='ArrowLeft') $('prev').click();
};
draw();
</script>
</body>
</html>
