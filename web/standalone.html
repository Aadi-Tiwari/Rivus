<style>
  :root{
    --ink:#08182B;          /* blueprint ground */
    --ink2:#0A2039;

    --paper:#EAF2F9;        /* annotation text */

  *{box-sizing:border-box;margin:0;padding:0}

  body{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;

  /* drafting grid, the paper itself */
  #sheet{position:fixed;inset:0;
    background-image:

      linear-gradient(90deg,rgba(127,168,204,.055) 1px,transparent 1px),

  svg#plan{position:fixed;inset:0;width:100%;height:100%}

  /* ---- title block, bottom-right like a real drawing ---- */
  .tblock{position:fixed;right:26px;bottom:96px;width:322px;

  .tblock .row{display:flex;border-bottom:1px solid var(--line-soft)}
  .tblock .row:last-child{border-bottom:0}
  .tblock .c{padding:7px 10px;border-right:1px solid var(--line-soft);flex:1}
  .tblock .c:last-child{border-right:0}
  .tblock .k{font-size:8px;letter-spacing:.19em;color:var(--paper-dim);

  .tblock .v{font-size:13px;font-variant-numeric:tabular-nums}
  .tblock .big{font-family:var(--disp);font-size:31px;line-height:1;font-weight:600}

  /* ---- the one statement ---- */
  .lede{position:fixed;left:38px;top:34px;max-width:min(41vw,540px)}
  .lede .eyebrow{font-size:9px;letter-spacing:.3em;color:var(--paper-dim);
                 text-transform:uppercase;margin-bottom:12px}
  .lede h1{font-family:var(--disp);font-size:clamp(30px,3.5vw,50px);line-height:1.03;

  .lede h1 em{font-style:italic;color:var(--live)}
  .lede p{margin-top:15px;font-size:12.5px;line-height:1.65;color:var(--paper-dim);
          max-width:430px}
  .lede p b{color:var(--paper);font-weight:400}

  .note{position:fixed;font-size:10.5px;line-height:1.5;letter-spacing:.02em;

  .note h4{display:block;color:var(--paper);letter-spacing:.16em;font-size:8.5px;

  .note b{color:var(--paper);font-weight:400}

  #noteA{left:38px;bottom:150px}
  #noteB{right:26px;top:34px;width:322px;max-width:322px;text-align:left}

  /* ---- filmstrip ---- */
  .strip{position:fixed;left:0;right:0;bottom:0;height:74px;display:flex;

// The network is tall and narrow. A drawing is laid out to fill its sheet, so rotate it
// a quarter turn to use the landscape screen instead of letterboxing two thirds of it.
const R = true;
const px = n => R ? n.y : n.x, py = n => R ? -n.x : n.y;
const XS = T.nodes.map(px), YS = T.nodes.map(py), M = 9;
const bb = {x0:Math.min(...XS)-M, y0:Math.min(...YS)-M,
            w:Math.max(...XS)-Math.min(...XS)+M*2, h:Math.max(...YS)-Math.min(...YS)+M*2};
$('plan').setAttribute('viewBox',`${bb.x0} ${bb.y0} ${bb.w} ${bb.h}`);
const U = bb.w/100;

const posteriorAt = s => s<1
  ? Object.fromEntries(T.nodes.map(n=>[n.name,1/T.nodes.length]))
  : T.steps[Math.min(s,NP)-1].posterior;
const planAt = s => (s>=NP+2 && s<=NP+1+NPLAN) ? T.isolation[s-NP-2] : null;
function credible(post,mass=0.9){
  const r=Object.entries(post).sort((a,b)=>b[1]-a[1]); const o=[]; let a=0;
  for(const [n,p] of r){o.push(n); a+=p; if(a>=mass) break;} return o;
}

function draw(){
  const post = posteriorAt(stage);
  const plan = planAt(stage);
  const dead = plan ? plan.stranded_graph : [];
  const cut  = plan ? plan.segment : [];
  const probed = T.steps.slice(0,Math.min(stage,NP)).map(s=>s.chosen);
  const surv = stage>=1 ? credible(post) : [];
  const fused = stage===NP+1
    ? [...new Set(T.identifiability.blocked.flatMap(b=>[b[1],b[2]]))] : [];

  let g = `<defs>
    <filter id="gl" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="${U*.7}" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // belief, rendered as survey contour rings rather than a coloured blob
  T.nodes.forEach(n=>{
    const rel=(post[n.name]||0)*T.nodes.length;
    if(rel>1.4){
      const k=Math.min(rel,9);
      for(let i=1;i<=3;i++)
        g+=`<circle cx="${px(n)}" cy="${py(n)}" r="${U*(1+k*.62*i/2)}" fill="none"
            stroke="var(--alarm)" stroke-opacity="${.36/i}" stroke-width="${U*.13}"/>`;
    }
  });

  // mains: drafting hairline, with live water drawn over the ones still charged
  T.pipes.forEach(p=>{
    const a=byName[p.a],b=byName[p.b]; if(!a||!b) return;
    const isCut=cut.includes(p.pid), off=dead.includes(p.a)&&dead.includes(p.b);
    g+=`<line x1="${px(a)}" y1="${py(a)}" x2="${px(b)}" y2="${py(b)}"
         stroke="${isCut?'var(--alarm)':off?'#173049':'var(--line)'}"
         stroke-opacity="${isCut?.9:off?1:.55}" stroke-width="${U*.17}"/>`;
    if(!isCut&&!off){
      const L=Math.hypot(px(b)-px(a),py(b)-py(a));
      g+=`<line x1="${px(a)}" y1="${py(a)}" x2="${px(b)}" y2="${py(b)}" class="flow"
           stroke="var(--live)" stroke-opacity=".5" stroke-width="${U*.3}"
           stroke-linecap="round" stroke-dasharray="${U*.9} ${U*4.4}" pathLength="200"
           style="animation-duration:${(2.4+L/30).toFixed(2)}s"/>`;
    }
    if(isCut){
      const mx=(px(a)+px(b))/2,my=(py(a)+py(b))/2;
      const ang=Math.atan2(py(b)-py(a),px(b)-px(a))*180/Math.PI;
      g+=`<g transform="translate(${mx} ${my}) rotate(${ang})" filter="url(#gl)">
        <line x1="${-U*.5}" y1="${-U*1.5}" x2="${-U*.5}" y2="${U*1.5}"
          stroke="var(--alarm)" stroke-width="${U*.26}"/>
        <line x1="${U*.5}" y1="${-U*1.5}" x2="${U*.5}" y2="${U*1.5}"
          stroke="var(--alarm)" stroke-width="${U*.26}"/></g>`;
    }
  });

  // junctions as survey marks
  T.nodes.forEach(n=>{
    const off=dead.includes(n.name), pr=probed.includes(n.name);
    const fu=fused.includes(n.name), inSet=surv.includes(n.name);
    c = off?'#20415F':'var(--line)';
    if(inSet) c='var(--alarm)';
    if(pr) c='var(--live)';
    if(n.critical) c = off?'var(--alarm)':'var(--safe)';
    const r = n.critical?U*.85:U*.45;
    g+=`<circle cx="${px(n)}" cy="${py(n)}" r="${r}" fill="var(--ink)" stroke="${c}"
         stroke-width="${U*.17}"${(pr||n.critical||inSet)?' filter="url(#gl)"':''}/>`;

    if(n.critical){
      const cc=off?'var(--alarm)':'var(--safe)';
      // leader points inboard: a label that runs off the sheet edge is a drawing error
      const right = px(n) > bb.x0 + bb.w*0.62;
      const d = right ? -1 : 1;
      g+=`<circle cx="${px(n)}" cy="${py(n)}" r="${U*2.1}" fill="none" stroke="${cc}"
            stroke-opacity=".5" stroke-width="${U*.11}" class="pulse"/>
        <line x1="${px(n)+d*U*2.1}" y1="${py(n)}" x2="${px(n)+d*U*4.6}" y2="${py(n)}"
            stroke="${cc}" stroke-width="${U*.09}" stroke-opacity=".65"/>
        <text x="${px(n)+d*U*5}" y="${py(n)+U*.55}" font-size="${U*1.5}" fill="${cc}"
            text-anchor="${right?'end':'start'}"
            letter-spacing="${U*.15}" font-family="var(--mono)">CRITICAL · HOSPITAL</text>`;
    }
    if(pr){
      const k=probed.indexOf(n.name)+1;
      g+=`<line x1="${px(n)}" y1="${py(n)-U*1.1}" x2="${px(n)}" y2="${py(n)-U*3}"
            stroke="var(--live)" stroke-width="${U*.09}" stroke-opacity=".7"/>
        <text x="${px(n)}" y="${py(n)-U*3.6}" font-size="${U*1.35}" fill="var(--live)"
            text-anchor="middle" font-family="var(--mono)">P${k} · ${n.name}</text>`;
    }
    if(inSet&&!pr){
      const rt = px(n) > bb.x0 + bb.w*0.9;
      g+=`<text x="${px(n)+(rt?-U*1.5:U*1.5)}" y="${py(n)-U*1.2}" font-size="${U*1.35}"
            text-anchor="${rt?'end':'start'}"
            fill="var(--alarm)" font-family="var(--mono)">${n.name}</text>`;
    }
  });

  if(stage>=NP+1){
    const t=byName[S.truth];
    if(t) g+=`<g filter="url(#gl)">
      <circle cx="${px(t)}" cy="${py(t)}" r="${U*1.7}" fill="none" stroke="#fff"
        stroke-opacity=".85" stroke-width="${U*.16}" stroke-dasharray="${U*.5} ${U*.45}"/>
      <text x="${px(t)}" y="${py(t)+U*3.8}" font-size="${U*1.35}" fill="#fff"
        opacity=".8" text-anchor="middle" font-family="var(--mono)">BREAK · ${S.truth}</text></g>`;
  }
  $('plan').innerHTML=g;
  chrome();
  strip();
}

function chrome(){
  const st = (stage>=1&&stage<=NP)?T.steps[stage-1]:null;
  const held = stage>=1?T.steps[Math.min(stage,NP)-1]:null;
  const plan = planAt(stage);
  const I = T.identifiability;
  const prior = Math.log2(T.nodes.length);
  const net3 = (T.measured||[]).find(m=>m.junctions>50);

  let eye='District 2 · as-built', h='', sub='';
  if(stage===0){
    eye='District 2 · as-built';
    h=`Somewhere under<br>these streets`;
    sub=`A main has failed. <b>${T.nodes.length} junctions</b> could be responsible. One crew
      check costs an hour; the wrong excavation costs about twenty thousand dollars.`;
  } else if(st){
    eye=`Probe ${st.step} of ${NP} · gauge at node ${st.chosen}`;
    h=`${held.survivors} <em>still possible</em>`;
    sub=`Reading <b>${st.reading>=0?'+':''}${f(st.reading)} psi</b> at node ${st.chosen},
      chosen because it removes more uncertainty than any other hydrant
      (<b>${f(st.bits)} bits</b>, ${f(st.minutes,0)} min away).`;
  } else if(stage===NP+1){
    eye='The limit of the evidence';
    h=`What we know, and<br>what we <em>don't</em>`;
    sub=`${I.blocked.length} of ${I.n_pairs} surviving pairs differ by less than the
      <b>${f(I.threshold)} psi</b> we can distinguish — anywhere in the network. No probe
      separates them. We report a set, never a pipe.`;
  } else if(plan){
    eye=`Isolation · ${plan.name}`;
    h=plan.accepted?`Hospital holds<br><em>${f(plan.critical_psi)} psi</em>`
                   :`Hospital falls to<br><em>${f(plan.critical_psi)} psi</em>`;
    sub=`Closing ${plan.valves||plan.segment.length} valve(s) leaves
      <b>${plan.stranded_hydraulics} of ${T.nodes.length}</b> junctions without service.
      Checked twice: a walker over the graph, and a pressure-dependent hydraulic run.`;
  }
  $('eyebrow').textContent=eye; $('head').innerHTML=h; $('sub').innerHTML=sub;

  // upper-right callout: what the evidence supports
  let b='';
  if(stage>=1){
    const surv=credible(posteriorAt(stage));
    b=`<h4>90% credible set</h4>${surv.join('  ·  ')}
       <div style="margin-top:8px">${surv.length} of ${T.nodes.length} junctions still in
       play. Top-1 is not a call we make.</div>`;
  }
  if(stage>=NP+2 && T.candidates){
    b=`<h4>Plan per candidate</h4>`;
    T.candidates.forEach(c=>{
      const bad=c.naive_critical_psi<S.critical_min_psi;
      b+=`<div style="margin:7px 0;padding-left:9px;border-left:1px solid ${bad?'var(--alarm)':'var(--line-soft)'}">
        node ${c.candidate} · p=${f(c.probability,2)} — safe plan holds
        ${f(c.critical_psi,0)} psi${bad?`, wrong valves drop it to
        <span style="color:var(--alarm)">${f(c.naive_critical_psi)} psi</span>`:''}</div>`;
    });
  }
  $('noteB').innerHTML=b;

  // lower-left callout: the measured result
  $('noteA').innerHTML = net3 ? `<h4>Measured against a random control</h4>
    On a ${net3.junctions}-junction district, information-gain probing finds the exact
    junction <b class="hi">${f(net3.info_top1,1)}%</b> of the time against <b>${f(net3.rand_top1,1)}%</b>
    by chance, and lands <b class="hi">${f(net3.lift,0)}% closer</b>. On the 35-junction network above
    it has no measurable advantage — we report both.` : '';

  const bits = held?held.entropy:prior;
  $('tblock').innerHTML=`
    <div class="row"><div class="c"><span class="k">Uncertainty</span>
      <span class="v big">${f(bits)}</span> <span class="k" style="display:inline">bits</span></div>
      <div class="c"><span class="k">Dispatches</span>
      <span class="v big">${Math.min(stage,NP)}</span>
      <span class="k" style="display:inline">of ${NP}</span></div></div>
    <div class="row"><div class="c"><span class="k">Drawing</span>
      <span class="v">NET2 · D2</span></div>
      <div class="c"><span class="k">Runs</span><span class="v">${S.sims} / ${f(S.sim_seconds)}s</span></div>
      <div class="c"><span class="k">Gauge σ</span><span class="v">${f(S.sigma)}</span></div></div>`;
}

function strip(){
  const names=['At rest',...T.steps.map(s=>`Probe ${s.step}`),'Limits',
               ...T.isolation.map((p,i)=>`Plan ${String.fromCharCode(65+i)}`)];
  let h='';
  for(let i=0;i<=LAST;i++){
    let v,s;
    if(i===0){v=T.nodes.length;s='candidates';}
    else if(i<=NP){v=T.steps[i-1].survivors;s=`gauge at ${T.steps[i-1].chosen}`;}
    else if(i===NP+1){v=T.identifiability.blocked.length;s='inseparable pairs';}
    else{const p=T.isolation[i-NP-2];v=f(p.critical_psi,1);
         s=(p.accepted?'psi · safe':'psi · rejected')+(p.chosen?' ★':'');}
    h+=`<div class="cell ${i===stage?'on':''}" data-i="${i}">
      <div class="k">${names[i]}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  }
  $('strip').innerHTML=h;
  document.querySelectorAll('.cell').forEach(e=>e.onclick=()=>{stage=+e.dataset.i;draw();});
}

document.onkeydown=e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault(); if(stage<LAST){stage++;draw();}}
  if(e.key==='ArrowLeft'&&stage>0){stage--;draw();}
};
draw();
</script>
</body>
</html>
