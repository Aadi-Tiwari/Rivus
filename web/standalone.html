<body>
<div id="app">
  <header>
    <div class="brand">Pipe<i>Trace</i></div>
    <div class="tag" id="hdr"></div>
    <div class="spacer"></div>
    <div class="live"><span class="dot"></span><span id="hdr2"></span></div>
  </header>

  <aside id="left"></aside>
  <main><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></main>
  <aside id="right"></aside>

  <footer>
    <div class="nav"><button id="prev">◀</button></div>
    <div class="steps" id="steps"></div>
    <div class="nav"><button id="next" class="go">NEXT ▶</button></div>
  </footer>
</div>

<script>
const T = window.TRACE, S = T.scenario;
const $ = id => document.getElementById(id);
const f = (v,n=2) => Number(v).toFixed(n);

const NP = T.steps.length, NPLAN = T.isolation.length;
const LAST = NP + 1 + NPLAN;
let stage = 0;

const byName = {};
T.nodes.forEach(n => byName[n.name] = n);
const xs = T.nodes.map(n=>n.x), ys = T.nodes.map(n=>n.y), pad = 7;
const bb = {x0:Math.min(...xs)-pad, y0:Math.min(...ys)-pad,
            w:Math.max(...xs)-Math.min(...xs)+pad*2,
            h:Math.max(...ys)-Math.min(...ys)+pad*2};
$('map').setAttribute('viewBox', `${bb.x0} ${bb.y0} ${bb.w} ${bb.h}`);
const SC = bb.w/100;

const posteriorAt = s => s<1
  ? Object.fromEntries(T.nodes.map(n=>[n.name,1/T.nodes.length]))
  : T.steps[Math.min(s,NP)-1].posterior;
const planAt = s => (s>=NP+2 && s<=NP+1+NPLAN) ? T.isolation[s-NP-2] : null;
const strandedAt = s => planAt(s) ? planAt(s).stranded_graph : [];
const cutAt = s => planAt(s) ? planAt(s).segment : [];

function draw(){
  const post = posteriorAt(stage);
  const stranded = strandedAt(stage), cut = cutAt(stage);
  const probed = T.steps.slice(0, Math.min(stage,NP)).map(s=>s.chosen);
  const fused = stage===NP+1
    ? [...new Set(T.identifiability.blocked.slice(0,14).flatMap(b=>[b[1],b[2]]))] : [];

  let g = `<defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="${SC*.85}" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  // belief, drawn beneath the network. Scaled against the uniform prior — sizing by
  // the running max would paint the whole district red when nothing is known yet.
  T.nodes.forEach(n=>{
    const rel = (post[n.name]||0) * T.nodes.length;
    if(rel>0.4){
      const k = Math.min(rel,8);
      g += `<circle cx="${n.x}" cy="${n.y}" r="${SC*(1+k*1.08)}" fill="var(--hot)"
            fill-opacity="${Math.min(.05+k*.05,.42)}"/>`;
    }
  });

  // Pipes render in two layers: a static tube, and a current that animates along it.
  // The current is the honest bit — it stops wherever the network has lost supply, so
  // a stranded district visibly goes still rather than just changing colour.
  T.pipes.forEach(p=>{
    const a=byName[p.a], b=byName[p.b];
    if(!a||!b) return;
    const isCut = cut.includes(p.pid);
    const dead = stranded.includes(p.a) && stranded.includes(p.b);
    const tube = isCut ? 'rgba(255,106,69,.30)' : dead ? '#0C1622' : 'rgba(27,122,155,.42)';
    g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
          stroke="${tube}" stroke-width="${SC*.85}" stroke-linecap="round"/>`;
    if(!isCut && !dead){
      const len = Math.hypot(b.x-a.x, b.y-a.y);
      g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="flow"
            stroke="var(--water)" stroke-opacity=".62" stroke-width="${SC*.34}"
            stroke-linecap="round" stroke-dasharray="${SC*1.1} ${SC*3.2}"
            pathLength="100" style="animation-duration:${(1.6+len/26).toFixed(2)}s"/>`;
    }
    if(isCut){
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;
      g += `<g transform="translate(${mx} ${my}) rotate(${ang})" filter="url(#glow)">
        <line x1="0" y1="${-SC*1.5}" x2="0" y2="${SC*1.5}" stroke="var(--hot)"
              stroke-width="${SC*.5}" stroke-linecap="round"/></g>`;
    }
  });

  // junctions
  T.nodes.forEach(n=>{
    const out = stranded.includes(n.name), isFused = fused.includes(n.name);
    const isProbe = probed.includes(n.name);
    let fill = out ? '#1B2938' : '#8FAAC6';
    if(n.critical) fill = out ? 'var(--hot)' : 'var(--ok)';
    if(isProbe) fill = 'var(--water)';
    if(isFused) fill = 'var(--warn)';
    const r = n.critical ? SC*1.35 : SC*.8;
    const fx = (isProbe||n.critical||isFused) ? ' filter="url(#glow)"' : '';
    g += `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}"${fx}/>`;

    if(n.critical){
      const c = out?'var(--hot)':'var(--ok)';
      g += `<circle cx="${n.x}" cy="${n.y}" r="${SC*2.6}" fill="none" stroke="${c}"
            stroke-opacity=".75" stroke-width="${SC*.28}"/>
        <text x="${n.x+SC*3.6}" y="${n.y+SC*.9}" font-size="${SC*2.2}" fill="${c}"
        letter-spacing="${SC*.14}" font-family="var(--mono)">HOSPITAL</text>`;
    }
    if(isProbe) g += `<text x="${n.x}" y="${n.y-SC*2}" font-size="${SC*2.1}"
        fill="var(--water)" text-anchor="middle" font-family="var(--mono)">${n.name}</text>`;
    if(isFused) g += `<text x="${n.x}" y="${n.y-SC*1.9}" font-size="${SC*2}"
        fill="var(--warn)" text-anchor="middle" font-family="var(--mono)">${n.name}</text>`;
  });

  // pressure wave from the measurement just taken
  if(stage>=1 && stage<=NP){
    const c = byName[T.steps[stage-1].chosen];
    if(c) for(let i=0;i<3;i++)
      g += `<circle cx="${c.x}" cy="${c.y}" r="${SC*(3+i*3.2)}" fill="none"
            stroke="var(--water)" stroke-width="${SC*.3}" class="ripple"
            style="animation-delay:${i*.22}s"/>`;
  }

  // truth, revealed only once probing is done
  if(stage>=NP+1){
    const t = byName[S.truth];
    if(t) g += `<circle cx="${t.x}" cy="${t.y}" r="${SC*2.1}" fill="none" stroke="#fff"
        stroke-opacity=".8" stroke-width="${SC*.3}" stroke-dasharray="${SC*.75} ${SC*.65}"/>
      <text x="${t.x}" y="${t.y+SC*4.9}" font-size="${SC*2}" fill="#fff" opacity=".7"
        text-anchor="middle" font-family="var(--mono)">ACTUAL ${S.truth}</text>`;
  }
  $('map').innerHTML = g;
  panels(); chips();
}

function panels(){
  const st = (stage>=1 && stage<=NP) ? T.steps[stage-1] : null;
  const held = stage>=1 ? T.steps[Math.min(stage,NP)-1] : null;
  const prev = stage>=2 ? T.steps[Math.min(stage,NP)-2] : null;

  let L = `<div class="block"><h2>Incident</h2>
    <div class="kv"><span>district draw</span><b>${f(S.demand_lps,1)} L/s</b></div>
    <div class="kv"><span>candidate junctions</span><b>${T.nodes.length}</b></div>
    <div class="kv"><span>hydraulic runs</span><b>${S.sims} in ${f(S.sim_seconds)}s</b></div>
    <div class="kv"><span>gauge sigma</span><b>${f(S.sigma)} psi</b></div>
    <div class="note">Readings come from a perturbed model — demands and pipe roughness
    shifted — so the diagnosis is not inverting its own simulator.</div></div>`;

  if(st){
    L += `<div class="block"><h2>Next best test</h2>
      <div class="rec"><div class="node">Node ${st.chosen}</div>
        <div class="kv"><span>expected gain</span><b>${f(st.bits)} bits</b></div>
        <div class="kv"><span>crew travel</span><b>${f(st.minutes,0)} min</b></div>
        <div class="kv"><span>measured</span><b>${st.reading>=0?'+':''}${f(st.reading)} psi</b></div>
      </div><div style="margin-top:11px">`;
    st.candidates.slice(1,5).forEach(c=>{
      L += `<div class="alt"><span>node ${c.node}</span><span>${f(c.bits)} bits · ${f(c.minutes,0)}m</span></div>`;
    });
    L += `</div><div class="note">Every candidate is scored by expected information
      gain over the belief held on the graph — not just the convenient ones.</div></div>`;
  } else if(stage===0){
    L += `<div class="block"><h2>Status</h2><div class="note">A main has failed somewhere
      in this district. Every junction is a live hypothesis. One crew check costs about
      an hour; the wrong excavation costs about twenty thousand dollars.</div></div>`;
  }

  L += `<div class="block"><h2>Belief</h2>
    <div class="hero">${held ? held.survivors : T.nodes.length}<small>of ${T.nodes.length} in the 90% set</small></div>
    ${prev ? `<div class="delta">▼ from ${prev.survivors} before this reading</div>`:''}
    ${held ? `<div style="margin-top:12px">
      <div class="kv"><span>entropy</span><b>${f(held.entropy)} bits</b></div>
      <div class="kv"><span>leading</span><b>node ${held.top} · p=${f(held.top_prob)}</b></div>
    </div>`:''}</div>`;
  $('left').innerHTML = L;

  const I = T.identifiability;
  let R = '';
  if(stage>=NP+1){
    R += `<div class="block"><h2>What pressure cannot resolve</h2>
      <div class="kv"><span>verdict</span><b>${I.verdict.replace(/_/g,' ').toLowerCase()}</b></div>
      <div class="kv"><span>unresolvable pairs</span><b>${I.blocked.length} of ${I.n_pairs}</b></div>
      <div style="margin-top:11px">`;
    I.blocked.slice(0,6).forEach(b=>{
      R += `<div class="pair"><span><em>${b[1]}</em> vs <em>${b[2]}</em></span>
            <span>${f(b[0],3)} psi</span></div>`;
    });
    R += `</div><div class="note">These differ by less than the ${f(I.threshold)} psi we
      can distinguish, anywhere in the network. No probe sequence separates them — the
      information is not there. Best remaining sensor site is node ${I.advice_node}
      at ${f(I.advice_sep,2)} psi.</div></div>`;
  }
  if(stage>=NP+2){
    R += `<div class="block"><h2>Valve search · ${NPLAN} configurations</h2>`;
    T.isolation.forEach((p,i)=>{
      R += `<div class="plan ${i===stage-NP-2?'on':''}">
        <span class="pill ${p.accepted?'yes':'no'}">${p.accepted?'ACCEPTED':'REJECTED'}</span>
        ${p.chosen?'<span class="pill pick">CHOSEN</span>':''}
        <div class="nm">${p.name}</div>
        <div class="kv"><span>valves turned</span><b>${p.valves}</b></div>
        <div class="kv"><span>hospital</span><b>${f(p.baseline_psi)} → ${f(p.critical_psi)} psi</b></div>
        <div class="kv"><span>customers out</span><b>${p.stranded_hydraulics} of ${T.nodes.length}</b></div>
        <div class="kv"><span>graph walker</span><b>${p.stranded_graph.length} stranded</b></div>
        <div class="kv"><span>cross-check</span>
          <b style="color:${p.agree?'var(--ok)':'var(--hot)'}">${p.agree?'AGREE':'DISAGREE'}</b></div>
      </div>`;
    });
    R += `<div class="note">A walker grows valve rings outward from the break, and every
      configuration is screened twice by methods sharing no code: graph reachability
      through open pipe edges, and a pressure-dependent hydraulic run on the same valves.
      Modeled service impact — not a safety certification.</div></div>`;
  }
  if(!R) R = `<div class="block"><h2>Evidence</h2><div class="note">Probe results, what
    the physics cannot resolve, and the isolation cross-check appear here as the
    investigation proceeds.</div></div>`;
  $('right').innerHTML = R;

  $('hdr').textContent = `district 2 · ${T.nodes.length} junctions · ${T.pipes.length} pipes`;
  $('hdr2').textContent = stage>=NP+1
    ? `break at node ${S.truth} · ${f(S.leak_lps,1)} L/s · ${f(S.leak_pct,0)}% of draw`
    : `leak hidden · ${S.sims} hydraulic runs complete`;
}

function chips(){
  const names = ['AT REST', ...T.steps.map(s=>`PROBE ${s.step}`), 'LIMITS',
                 ...T.isolation.map((p,i)=>`PLAN ${String.fromCharCode(65+i)}`)];
  let h='';
  for(let i=0;i<=LAST;i++){
    let v='—', s='';
    if(i===0){ v=T.nodes.length; s='candidates'; }
    else if(i<=NP){ v=T.steps[i-1].survivors; s=`node ${T.steps[i-1].chosen}`; }
    else if(i===NP+1){ v=T.identifiability.blocked.length; s='fused pairs'; }
    else { const p=T.isolation[i-NP-2]; v=f(p.critical_psi,1);
           s=(p.accepted?'psi · accepted':'psi · rejected')+(p.chosen?' ★':''); }
    h += `<div class="st ${i===stage?'on':''}" data-i="${i}">
            <div class="n">${names[i]}</div><div class="v">${v}</div>
            <div class="s">${s}</div></div>`;
  }
  $('steps').innerHTML = h;
  document.querySelectorAll('.st').forEach(e=>
    e.onclick = ()=>{ stage=+e.dataset.i; draw(); });
  $('prev').disabled = stage===0;
  $('next').disabled = stage===LAST;
}

$('next').onclick = ()=>{ if(stage<LAST){stage++;draw();} };
$('prev').onclick = ()=>{ if(stage>0){stage--;draw();} };
document.onkeydown = e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); $('next').click(); }
  if(e.key==='ArrowLeft') $('prev').click();
};
draw();
</script>
</body>
</html>
